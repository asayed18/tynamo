<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Tynamo: stacked steel table discs (DynamoDB) cut by a red bolt. Steel + red accent matches the ICOP mark. -->
  <defs>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f3f46"/>
      <stop offset=".25" stop-color="#d4d4d8"/>
      <stop offset=".45" stop-color="#f4f4f5"/>
      <stop offset=".7" stop-color="#71717a"/>
      <stop offset="1" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4e4e7"/>
      <stop offset="1" stop-color="#71717a"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a8a"/>
      <stop offset=".5" stop-color="#ef1c1c"/>
      <stop offset="1" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- three stacked discs, bottom to top -->
  <g stroke="#18181b" stroke-width="6">
    <path d="M86 340 v56 a170 52 0 0 0 340 0 v-56" fill="url(#side)"/>
    <ellipse cx="256" cy="340" rx="170" ry="52" fill="#27272a"/>
    <path d="M86 248 v56 a170 52 0 0 0 340 0 v-56" fill="url(#side)"/>
    <ellipse cx="256" cy="248" rx="170" ry="52" fill="#27272a"/>
    <path d="M86 156 v56 a170 52 0 0 0 340 0 v-56" fill="url(#side)"/>
    <ellipse cx="256" cy="156" rx="170" ry="52" fill="url(#top)"/>
  </g>
  <!-- bolt -->
  <path filter="url(#glow)" d="M282 70 L196 270 h62 l-34 172 l118 -226 h-66 l44 -146 z" fill="url(#bolt)" stroke="#450a0a" stroke-width="6" stroke-linejoin="round"/>
  <path d="M276 92 L214 254" stroke="#fff" stroke-opacity=".45" stroke-width="6" stroke-linecap="round"/>
</svg>
